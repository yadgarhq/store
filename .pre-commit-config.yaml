# Every yadgarhq repo carries pre-commit (D59). Hook failure is signal, not
# obstacle: fix the cause and re-stage. Never --no-verify.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-toml

  # Shared, from yadgarhq/actions (D62). These were local blocks copied into
  # every Rust repository until the shared definition existed.
  # IMMUTABLE rev, unlike the @v1 the workflow caller pins. pre-commit caches a
  # rev at first install and never re-resolves it — "mutable references are never
  # updated after first install and are not supported" — so a moving tag here
  # would silently freeze each machine at whatever v1 meant the day it first ran.
  # GitHub Actions re-resolves @v1 every run; pre-commit does not. Bump with
  # `pre-commit autoupdate`.
  # JSON, YAML and Markdown. `proseWrap: preserve` in .prettierrc is doing real
  # work: without it prettier reflows prose and every future diff to a
  # hand-wrapped document becomes unreadable. With it, prose line breaks are left
  # exactly as written and only markup is normalised — measured at 15% of lines
  # on the largest document here, all of it emphasis characters and table
  # alignment.
  #
  # pre-commit/mirrors-prettier is archived; rbubley's is the maintained fork.
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.6
    hooks:
      - id: prettier
        types_or: [markdown, json, yaml]

  - repo: https://github.com/yadgarhq/actions
    rev: v1.0.0
    hooks:
      - id: gitleaks
      - id: cargo-fmt
      - id: cargo-clippy

  - repo: local
    hooks:
      # NOT the shared cargo-deny hook, and only until cargo-deny is in the dev
      # profile — the shared one calls `cargo deny` directly, which is right
      # once the tool is installed. Adopting it now would fail every commit
      # here. `nix run` is slower but works today. CI runs the real check
      # regardless, so the gate is not lost while this override stands.
      - id: cargo-deny
        name: cargo deny (licences, advisories, sources)
        language: system
        entry: nix run nixpkgs#cargo-deny -- check
        pass_filenames: false
        files: (Cargo\.(toml|lock)|deny\.toml)$
