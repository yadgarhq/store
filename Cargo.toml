[package]
name = "yadgar-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "Engine primitives for yadgar -db services: pool, transactions, migrations, capability probe, credentials, backup harness. Knows zero entity schemas."
repository = "https://github.com/yadgarhq/store"

[dependencies]
thiserror = "2"
tracing = "0.1"

# rustls, never native-tls (D63). native-tls links OpenSSL, which means a
# glibc-linked binary, which means distroless/cc instead of distroless/static
# and a base ten times larger carrying code nothing here uses. Choosing this at
# the first service keeps the static musl build available; discovering it at the
# fortieth means changing forty.
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "tls-rustls-ring",
    "mysql",
    "macros",
] }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# D59: warnings are errors at commit time, not in review.
all = { level = "deny", priority = -1 }
