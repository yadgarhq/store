name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: test
        run: cargo test --all-features

  licences:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # D24 requires a permissive stack stay viable and O10 requires the audit
      # be re-run before adding a dependency. Enforced, not remembered.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
