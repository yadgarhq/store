name: ci

# CI is defined once in yadgarhq/actions (D62). This file is the whole of this
# repository's CI configuration: the shared workflow detects what the repository
# is and runs what applies.
#
# The weekly schedule is not redundant with the pull request run. Callers track
# @main, so a repository never revalidates when a shared workflow changes or a
# new advisory lands — the schedule is what notices. Push to main runs the
# version report only; validating there would re-run what the pull request just
# passed, on code already merged, with nobody watching.
#
# TWO jobs rather than one, and it is a permissions boundary rather than a style
# choice: publishing needs packages: write and id-token: write, and a single job
# would grant both on every pull request.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

jobs:
  ci:
    if: "!startsWith(github.ref, 'refs/tags/')"
    uses: yadgarhq/actions/.github/workflows/ci.yml@main

  release:
    if: startsWith(github.ref, 'refs/tags/')
    uses: yadgarhq/actions/.github/workflows/ci-release.yml@main
    with:
      version: ${{ github.ref_name }}
    permissions:
      contents: read
      packages: write
      id-token: write
